<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Lenda de Aang: O Último Mestre do Ar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&family=Trade+Winds&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="menu">
            <a href="index.html" class="logo"><img src="imagens/logoaang.png" alt="logotipo" class="logoFilme"></a>

            <div class="links">
                <a href="index.html">Início</a>
                <a href="filme.html">Sobre</a>
                <a href="contato.html">Contato</a>
            </div>
        </nav>
    </header>

    <main class="inicio">

        <section class="hero">

            <div class="poster">
                <img src="imagens/cartaz.jpg" alt="Cartaz do filme Avatar">
            </div>


            <div class="hero-text">

                <p class="subtitulo">UMA NOVA AVENTURA ESTÁ CHEGANDO</p>

                    A Lenda de Aang
                    <span>O ÚLTIMO MESTRE DO AR</span>

                        <span id="minutos">00</span>

                    </div>

                    <div class="separador">:</div>

                    <div class="tempo">
                        <span id="segundos">00</span>
                        <small>SEGUNDOS</small>
                    </div>

                </div>

                <p id="mensagem-contagem" class="mensagem-contagem"></p>

                <a href="filme.html" class="botao">
                    CONHEÇA O FILME
                </a>

            </div>

        </section>

    </main>
    <script src="script.js"></script>
