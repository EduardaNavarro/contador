<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - A Lenda de Aang: O Último Mestre do Ar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&family=Trade+Winds&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="menu">

            <a href="index.html" class="logo"><img src="imagens/logoaang.png" alt="logotipo" class="logoFilme"></a>

            <div class="links">
                <a href="index.html">Início</a>
                <a href="filme.html">Sobre</a>
                <a href="contato.html">Contato</a>
            </div>

        </nav>
    </header>


    <main class="pagina-contato">

        <section class="titulo-pagina">

            <p class="subtitulo">PRECISA DE AJUDA?</p>

            <h1>ENVIE UM TICKET</h1>

            <p>
                Preencha o formulário abaixo para enviar uma
                reclamação ou solicitar ajuda.
            </p>

        </section>


        <section class="formulario-container">

            <form id="ticketForm">

                <div class="campo">

                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                    >

                </div>


                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                    >

                </div>


                <div class="campo">

                    <label for="assunto">Assunto</label>

                    <select id="assunto" name="assunto">

                        <option value="">
                            Selecione um assunto
                        </option>

                        <option value="ingresso">
                            Problema com ingresso
                        </option>

                        <option value="site">
                            Problema no site
                        </option>

                        <option value="pagamento">
                            Problema com pagamento
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="mensagem">Mensagem</label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="6"
                        placeholder="Descreva seu problema..."
                    ></textarea>

                </div>


                <button type="submit" class="botao">
                    ENVIAR TICKET
                </button>

                <p id="mensagem-ticket"></p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
